<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>Квартирка</title>
        <meta
            name="theme-color"
            content="#087f5b"
        />
        <link
            rel="icon"
            href="/icon.svg"
            type="image/svg+xml"
        />

            rel="apple-touch-icon"
            href="/icons/apple-touch-icon.png"
            sizes="180x180"
        />

            name="description"
            content="Общие накопления и покупки для вашего дома"
        />
        <script>
            try {
                document.documentElement.dataset.mantineColorScheme =
                    localStorage.getItem("mantine-color-scheme-value") === "dark" ? "dark" : "light";
            } catch {
                document.documentElement.dataset.mantineColorScheme = "light";
            }
        </script>

            type="module"
            src="/src/main.tsx"
        ></script>
